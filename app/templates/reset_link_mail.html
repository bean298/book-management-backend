<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset Password</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #eef1f8;
      font-family:
        &quot;Segoe UI&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background-color: #eef1f8"
    >
      <tr>
        <td align="center" style="padding: 30px 20px">
          <table
            role="presentation"
            width="560"
            cellpadding="0"
            cellspacing="0"
            style="
              max-width: 560px;
              background-color: #ffffff;
              border-radius: 20px;
            "
          >
            <!-- HEADER -->
            <tr>
              <td
                align="center"
                style="
                  background-color: #667eea;
                  padding: 48px 30px 40px;
                  border-radius: 20px 20px 0 0;
                "
              >
                <h1 style="margin: 0; color: #fff; font-size: 24px">
                  🔑 Reset Your Password
                </h1>
              </td>
            </tr>
            <!-- BODY -->
            <tr>
              <td style="padding: 36px 32px">
                <table role="presentation" width="100%">
                  <tr>
                    <td
                      style="
                        padding-bottom: 14px;
                        font-size: 18px;
                        font-weight: 600;
                        color: #1a1a2e;
                      "
                    >
                      Hey <span style="color: #667eea">{{ name }}</span>,
                    </td>
                  </tr>
                  <tr>
                    <td
                      style="
                        padding-bottom: 28px;
                        font-size: 15px;
                        line-height: 1.75;
                        color: #4a4a6a;
                      "
                    >
                      We received a request to reset your password. Click the
                      button below to set a new password. This link expires in 5
                      minutes.
                    </td>
                  </tr>
                  <tr>
                    <td align="center" style="padding-bottom: 28px">
                      <a
                        href="{{ reset_url }}"
                        target="_blank"
                        style="
                          display: inline-block;
                          background-color: #667eea;
                          color: #ffffff;
                          text-decoration: none;
                          padding: 14px 32px;
                          border-radius: 10px;
                          font-size: 16px;
                          font-weight: 600;
                        "
                      >
                        Reset Password
                      </a>
                    </td>
                  </tr>
                  <tr>
                    <td style="padding-top: 24px; font-size: 13px; color: #888">
                      If you didn't request this, you can safely ignore this
                      email.
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <!-- FOOTER -->
            <tr>
              <td
                align="center"
                style="
                  background-color: #f6f7fb;
                  border-radius: 0 0 20px 20px;
                  padding: 20px;
                  font-size: 12px;
                  color: #aaa;
                "
              >
                Book Management
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
