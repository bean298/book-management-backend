<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset Password - Book Management</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Arial, sans-serif;
        background: linear-gradient(135deg, #667eea, #764ba2);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      /* --- Card --- */
      .card {
        background: #fff;
        border-radius: 20px;
        padding: 40px 32px;
        max-width: 420px;
        width: 100%;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
      }

      .card h2 {
        color: #1a1a2e;
        font-size: 24px;
        margin-bottom: 8px;
      }

      .card p {
        color: #888;
        font-size: 14px;
        margin-bottom: 24px;
      }

      /* --- Field password --- */
      .field {
        margin-bottom: 18px;
      }

      .field label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #555;
        margin-bottom: 6px;
      }

      .field input {
        width: 100%;
        padding: 12px 14px;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        font-size: 15px;
        transition: border 0.2s;
        outline: none;
      }

      .field input:focus {
        border-color: #667eea;
      }

      /* --- BTN --- */
      .btn {
        width: 100%;
        padding: 14px;
        background: #667eea;
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 8px;
        transition: background 0.2s;
      }

      .btn:hover {
        background: #5a6fd6;
      }

      .btn:disabled {
        background: #bbb;
        cursor: not-allowed;
      }

      /* --- Message --- */
      .msg {
        margin-top: 16px;
        padding: 12px;
        border-radius: 8px;
        font-size: 14px;
        display: none;
      }

      .msg.success {
        background: #e6f9ed;
        color: #1e7e34;
        border: 1px solid #b7ebc5;
      }

      .msg.error {
        background: #fff0f0;
        color: #c0392b;
        border: 1px solid #f5c6cb;
      }

      /* --- Bar --- */
      .bar {
        height: 4px;
        border-radius: 2px;
        margin-bottom: 8px;
        transition: width 0.3s;
        background: #e0e0e0;
      }

      .bar.weak {
        background: #e74c3c;
        width: 33%;
      }

      .bar.medium {
        background: #f39c12;
        width: 66%;
      }

      .bar.strong {
        background: #27ae60;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <!-- Card -->
    <div class="card">
      <!-- Title -->
      <h2>🔑 Reset Password</h2>

      <!-- Sub Title -->
      <p>Enter your new password below.</p>

      <!-- Form -->
      <form id="form" onsubmit="submitForm(event)">
        <!-- Password -->
        <div class="field">
          <label>New Password</label>

          <input
            type="password"
            id="pwd"
            placeholder="At least 6 characters"
            minlength="6"
            required
            oninput="checkStrength()"
          />
        </div>

        <!-- Strength bar check -->
        <div id="strength-bar" class="bar"></div>

        <!-- Confirm password -->
        <div class="field">
          <label>Confirm Password</label>

          <input
            type="password"
            id="confirm"
            placeholder="Re-enter password"
            required
          />
        </div>

        <input type="hidden" id="token" value="{{ token }}" />

        <!-- BTN -->
        <button type="submit" class="btn" id="submit-btn">
          Reset Password
        </button>
      </form>

      <!-- Message -->
      <div id="msg" class="msg"></div>
    </div>

    <script>
      // Check strength
      function checkStrength() {
        const bar = document.getElementById("strength-bar");

        bar.className = "bar";

        const len = document.getElementById("pwd").value.length;
        if (len >= 10) bar.classList.add("strong");
        else if (len >= 6) bar.classList.add("medium");
        else if (len > 0) bar.classList.add("weak");
      }

      // Submit Form
      async function submitForm(e) {
        e.preventDefault();
        const pwd = document.getElementById("pwd").value;
        const confirm = document.getElementById("confirm").value;
        const token = document.getElementById("token").value;
        const btn = document.getElementById("submit-btn");

        if (pwd !== confirm) {
          showMsg("Passwords do not match.", "error");
          return;
        }
        if (pwd.length < 6) {
          showMsg("Password must be at least 6 characters.", "error");
          return;
        }

        btn.disabled = true;
        btn.textContent = "Resetting...";

        try {
          // Call API to reset password
          const res = await fetch("/auth/reset-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ reset_token: token, new_password: pwd }),
          });

          const data = await res.json();
          if (res.ok) {
            showMsg(
              "✅ " + data.message + ' <a href="/docs">Go to Login →</a>',
              "success",
            );
            document.getElementById("form").style.display = "none";
          } else {
            showMsg("❌ " + data.detail, "error");
            btn.disabled = false;
            btn.textContent = "Reset Password";
          }
        } catch (err) {
          showMsg("❌ Network error. Please try again.", "error");
          btn.disabled = false;
          btn.textContent = "Reset Password";
        }
      }

      // Show message
      function showMsg(text, type) {
        const msg = document.getElementById("msg");
        msg.className = "msg " + type;
        msg.innerHTML = text;
        msg.style.display = "block";
      }
    </script>
  </body>
</html>
