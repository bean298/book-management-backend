<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Welcome</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #eef1f8;
      font-family:
        &quot;Segoe UI&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background-color: #eef1f8"
    >
      <tr>
        <td align="center" style="padding: 30px 20px">
          <table
            role="presentation"
            width="560"
            cellpadding="0"
            cellspacing="0"
            style="
              max-width: 560px;
              background-color: #ffffff;
              border-radius: 20px;
            "
          >
            <!-- HEADER -->
            <tr>
              <td
                align="center"
                style="
                  background-color: #667eea;
                  padding: 48px 30px 40px;
                  border-radius: 20px 20px 0 0;
                "
              >
                <table role="presentation">
                  <tr>
                    <td
                      align="center"
                      style="
                        width: 72px;
                        height: 72px;
                        background-color: rgba(255, 255, 255, 0.15);
                        border-radius: 50%;
                        font-size: 36px;
                      "
                    >
                      📚
                    </td>
                  </tr>
                  <tr>
                    <td align="center" style="padding-top: 16px">
                      <h1 style="margin: 0; color: #fff; font-size: 26px">
                        Welcome Aboard!
                      </h1>
                    </td>
                  </tr>
                  <tr>
                    <td align="center" style="padding-top: 8px">
                      <p
                        style="
                          margin: 0;
                          color: rgba(255, 255, 255, 0.8);
                          font-size: 14px;
                        "
                      >
                        Your reading journey starts now
                      </p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <!-- BODY -->
            <tr>
              <td style="padding: 36px 32px">
                <table role="presentation" width="100%">
                  <tr>
                    <td
                      style="
                        padding-bottom: 14px;
                        font-size: 19px;
                        font-weight: 600;
                        color: #1a1a2e;
                      "
                    >
                      Hey <span style="color: #667eea">{{ name }}</span>,
                    </td>
                  </tr>
                  <tr>
                    <td
                      style="
                        padding-bottom: 28px;
                        font-size: 15px;
                        line-height: 1.75;
                        color: #4a4a6a;
                      "
                    >
                      Thank you for joining <strong>Book Management</strong>! 🎉
                    </td>
                  </tr>
                  <tr>
                    <td align="center" style="padding-bottom: 28px">
                      <a
                        href="{{ server_url }}/docs"
                        target="_blank"
                        style="
                          display: inline-block;
                          background-color: #667eea;
                          color: #fff;
                          text-decoration: none;
                          padding: 15px 40px;
                          border-radius: 12px;
                          font-size: 16px;
                          font-weight: 600;
                        "
                      >
                        Get Started →
                      </a>
                    </td>
                  </tr>
                  <tr>
                    <td align="center" style="font-size: 13px; color: #888">
                      If you didn't create this account, please ignore this
                      email.
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <!-- FOOTER -->
            <tr>
              <td
                align="center"
                style="
                  padding: 24px;
                  background-color: #fafbff;
                  border-top: 1px solid #eef2f7;
                  border-radius: 0 0 20px 20px;
                "
              >
                <p style="margin: 0; font-size: 12px; color: #9a9ab0">
                  <strong style="color: #667eea">Book Management</strong> —
                  Built with ❤️<br />
                  &copy; {{ year }} Book Management. All rights reserved.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
